server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      tracking-modes: cookie

spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  application:
    name: material-studio-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_studio?connectionTimeZone=UTC}
    username: ${DB_USER:material_app}
    password: ${DB_PASSWORD:local_app_password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

app:
  tasks:
    worker-enabled: ${TASK_WORKER_ENABLED:true}
    simulation-controls-enabled: ${TASK_SIMULATION_CONTROLS_ENABLED:false}
    poll-interval-ms: 300
    check-delay-ms: ${TASK_CHECK_DELAY_MS:1500}
    generate-delay-ms: ${TASK_GENERATE_DELAY_MS:3500}
    finalize-delay-ms: ${TASK_FINALIZE_DELAY_MS:1500}
  material-directory: ${MATERIAL_DIRECTORY:./data/materials}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
