# 与 compose.yaml 合并使用，提供源码挂载与 Next.js 热更新。
services:
  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
      JAVA_API_ORIGIN: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - frontend_npm_cache:/root/.npm
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]

  backend:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/pom.xml:/app/pom.xml:ro
    command: ["mvn", "--batch-mode", "spring-boot:run"]

volumes:
  frontend_node_modules:
  frontend_next:
  frontend_npm_cache:
